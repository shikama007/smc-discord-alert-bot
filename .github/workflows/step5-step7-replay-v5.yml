name: SMC Step 5-7 Replay Validation V5

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Step 5-7 diagnostic replay V5
        run: python validate_step5_step7_replay_v5.py

      - name: Upload V5 reports
        uses: actions/upload-artifact@v4
        with:
          name: step5-step7-replay-v5
          path: |
            step5_step7_replay_v5_cases.csv
            step5_step7_replay_v5_candidates.csv
