name: SMC Step 5-8 Replay Validation V3

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Step 5-8 full sequence replay V3
        run: python validate_step5_step8_replay_v3.py

      - name: Upload V3 full sequence report
        uses: actions/upload-artifact@v4
        with:
          name: step5-step8-replay-v3-full-sequence
          path: step5_step8_replay_v3_full_sequence.csv
