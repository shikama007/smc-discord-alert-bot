name: SMC Step 5-8 Replay Validation V2

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Step 7 debug replay V2
        run: python validate_step5_step8_replay_v2.py

      - name: Upload V2 debug report
        uses: actions/upload-artifact@v4
        with:
          name: step5-step8-replay-v2-debug
          path: step5_step8_replay_v2_debug.csv
