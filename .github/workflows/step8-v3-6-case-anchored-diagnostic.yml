name: SMC Step 8 V3.6 Case-Anchored Diagnostic Replay

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Step 8 V3.6 diagnostic replay
        run: python validate_step8_v3_6_case_anchored_diagnostic.py

      - name: Upload diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: step8-v3-6-case-anchored-diagnostic
          path: |
            step8_v3_6_cases.csv
            step8_v3_6_candles.csv
