name: SMC Step 8 V3.5 Diagnostic Replay

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas

      - name: Run Step 8 diagnostic replay
        run: python validate_step8_v3_5_diagnostic_replay.py

      - name: Upload diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: step8-v3-5-diagnostic-replay
          path: |
            step8_v3_5_diagnostic_cases.csv
            step8_v3_5_diagnostic_candles.csv
