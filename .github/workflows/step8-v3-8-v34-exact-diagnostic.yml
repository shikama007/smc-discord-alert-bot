name: SMC Step 8 V3.8 V3.4 Exact Diagnostic

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas

      - name: Run V3.8 exact V3.4 diagnostic
        run: python validate_step8_v3_8_v34_exact_diagnostic.py

      - name: Upload V3.8 reports
        uses: actions/upload-artifact@v4
        with:
          name: step8-v3-8-v34-exact-diagnostic
          path: |
            step8_v3_8_cases.csv
            step8_v3_8_snapshots.csv
            step8_v3_8_candles.csv
