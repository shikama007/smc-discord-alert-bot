name: SMC Step 9 15M 5M Historical Replay

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Step 9 replay
        run: python validate_step9_15m_5m_replay.py

      - name: Upload Step 9 reports
        uses: actions/upload-artifact@v4
        with:
          name: step9-15m-5m-replay
          path: |
            step9_15m_5m_cases.csv
            step9_15m_5m_matrix.csv
            step9_15m_5m_summary.csv
