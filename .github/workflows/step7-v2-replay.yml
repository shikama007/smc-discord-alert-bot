name: SMC Step 7 V2 Replay Validation

on:
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run Step 7 V2 replay
        run: python validate_step7_v2_replay.py

      - name: Upload Step 7 V2 replay reports
        uses: actions/upload-artifact@v4
        with:
          name: step7-v2-replay-reports
          path: |
            step7_v2_replay_cases.csv
            step7_v2_replay_snapshots.csv
